[project]
name = "localcontrol"
version = "0.1.0"
description = "Local-LLM desktop usage monitor that enforces plain-English rules on macOS"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
localcontrol = "localcontrol.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
localcontrol = ["static/*.html"]
