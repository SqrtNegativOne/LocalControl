name: LocalControl
options:
  bundleIdPrefix: com.eugenevinitsky
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: "3.32.3"
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: "0.9.0"
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.0"
targets:
  LocalControl:
    type: application
    platform: macOS
    sources:
      - Mac
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugenevinitsky.localcontrol
        INFOPLIST_FILE: Mac/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
    postBuildScripts:
      # SMAppService.agent looks for its plist inside the bundle.
      - name: Embed LaunchAgent
        script: |
          mkdir -p "$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents"
          cp "$SRCROOT/Mac/com.eugenevinitsky.localcontrol.agent.plist" "$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents/"
        basedOnDependencyAnalysis: false
    entitlements:
      path: Mac/Mac.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.eugenevinitsky.localcontrol

  LocalControlPhone:
    type: application
    platform: iOS
    sources:
      - iOS/App
      - Shared
    dependencies:
      - target: LocalControlMonitor
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXGuidedGeneration
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugenevinitsky.localcontrol.phone
        PRODUCT_NAME: LocalControl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: iOS/App/Info.plist
      properties:
        CFBundleDisplayName: LocalControl
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: iOS/App/App.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.eugenevinitsky.localcontrol]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.eugenevinitsky.localcontrol

  LocalControlMonitor:
    type: app-extension
    platform: iOS
    sources:
      - iOS/Monitor
      - path: Shared/Rule.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugenevinitsky.localcontrol.phone.monitor
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: iOS/Monitor/Info.plist
      properties:
        CFBundleDisplayName: LocalControl Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).Monitor
    entitlements:
      path: iOS/Monitor/Monitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.eugenevinitsky.localcontrol]
